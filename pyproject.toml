[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcms"
version = "0.3.0"
description = "AgentCMS — an API-first CMS whose first user is an AI agent"
requires-python = ">=3.11"
license = { text = "MIT" }
# Pinned at install time by requirements.lock.txt (see docs/service.md § Dependency lock).
# Add a dep here, then regenerate the lock; CI checks that the two agree.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "markdown>=3.6,<4",
    "markdown-it-py>=3.0,<4",
    "python-multipart>=0.0.9,<1",
    "Pillow>=10.0,<13",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
    "mcp>=1.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    # Tooling: the lockfile is generated with pip-compile and checked by
    # scripts/check_lock.py, both of which need these.
    "packaging>=24,<30",
    "pip-tools>=7,<8",
]

[project.scripts]
agentcms = "scripts.cli:main"
agentcms-mcp = "app.mcp.server:run_stdio_server"

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1", "app.db", "app.models", "app.domain", "app.services", "app.utils", "app.dashboard", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: test needs a live PostgreSQL server (ephemeral cluster or TEST_DATABASE_URL)",
    "asyncio: test uses asyncio",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"app/dashboard/templates.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
# No SQLAlchemy mypy plugin: SQLAlchemy 2.0 types the ORM inline, and the
# sqlalchemy.ext.mypy.plugin shim it replaced was DELETED in 2.1 (#40). Declaring
# it made the whole type gate depend on a module a routine dependency bump could
# remove -- which is exactly how lint died at startup on 2026-09-25.
files = ["app", "scripts"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["^alembic/"]
