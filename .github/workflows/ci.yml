# Continuous integration (#2). Red CI blocks merge into main: branch protection
# requires the `lint` and `test` checks (see docs/TESTING.md § Dependency lock).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # Nightly at 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The runners always have a Docker daemon, so tests that need one must FAIL
  # (not skip) when it is missing — a skipped deploy check is what hid #35/#36.
  AGENTCMS_REQUIRE_DOCKER: "1"

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (pinned from requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          # Everything is pinned in the lock, so CI tests exactly what we ship.
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Lockfile matches pyproject.toml
        run: python scripts/check_lock.py
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  migrations:
    name: migrations (up + down on Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agentcms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (pinned from requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          # Everything is pinned in the lock, so CI tests exactly what we ship.
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Upgrade from empty
        run: alembic upgrade head
      - name: Downgrade back to empty
        run: alembic downgrade base
      - name: Upgrade again (idempotent)
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The suite creates and drops its own databases on this server.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (pinned from requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          # Everything is pinned in the lock, so CI tests exactly what we ship.
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Pytest
        run: pytest -q

  test-locale-scrubbed:
    name: test (locale-scrubbed, py3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The suite creates and drops its own databases on this server.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (pinned from requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          # Everything is pinned in the lock, so CI tests exactly what we ship.
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Pytest (locale-scrubbed)
        run: |
          # Scrub locale vars to reproduce the failure mode from #34
          env -u LANG -u LC_ALL -u LC_CTYPE -u LANGUAGE pytest -q


  # The definition of "a stranger can self-deploy" (#37).  It runs the commands
  # from docs/deploy/quickstart.md verbatim, from a clean checkout, and asserts
  # every layer: migrations, liveness, readiness, no crash loop, and a real write
  # -> publish -> public-read roundtrip.  Shelling out to scripts/selfhost_e2e.sh
  # (rather than inlining YAML) means a human can run the identical check.
  #
  # It fails — never skips — when Docker is unavailable, and it always tears the
  # stack down with `down -v`, so a broken build cannot make the next run flaky.
  selfhost:
    name: self-host deploy (clean checkout, real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout into a clean directory (no .env, no image cache)
        uses: actions/checkout@v4
        with:
          path: agentcms-clean

      - name: Deploy the documented path and assert it serves content
        working-directory: agentcms-clean
        run: ./scripts/selfhost_e2e.sh --timeout 240

      - name: Dump the stack's logs if the assertion failed
        if: failure()
        working-directory: agentcms-clean
        run: |
          docker compose --env-file .env -f deploy/compose/docker-compose.prod.yml logs --tail=200 || true
